name: Build & Test Sheeda ANeko APK

on:
  push:
    paths:
      - 'Projects/Jarvis/body/aneko/**'
      - '.github/workflows/build_aneko_apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Sheeda ANeko APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Run Unit Tests
        working-directory: Projects/Jarvis/body/aneko
        run: gradle test --stacktrace

      - name: Build Signed Release APK
        working-directory: Projects/Jarvis/body/aneko
        run: gradle assembleRelease --stacktrace

      - name: Record Version and SHA256
        working-directory: Projects/Jarvis/body/aneko
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/sheeda-aneko-release.apk
          sha256sum ../dist/sheeda-aneko-release.apk > ../dist/sheeda-aneko-release.apk.sha256
          cat ../dist/sheeda-aneko-release.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheeda-aneko-release
          path: Projects/Jarvis/body/aneko/app/build/outputs/apk/**/*.apk
          retention-days: 14
